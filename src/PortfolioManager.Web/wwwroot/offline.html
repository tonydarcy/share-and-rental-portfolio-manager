<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8f9fa; color: #212529; margin: 0; padding: 3rem 1rem; text-align: center; }
        h1 { font-size: 1.4rem; }
        button { font-size: 1rem; padding: .5rem 1.2rem; border: 0; border-radius: .375rem; background: #0d6efd; color: #fff; }
    </style>
</head>
<body>
    <h1>You're offline</h1>
    <p>Your portfolio needs an internet connection. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
</body>
</html>
